<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <style>
    .arc1 { animation: pulse 2.4s ease-in-out infinite; }
    .arc2 { animation: pulse 2.4s ease-in-out 0.3s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
  <!-- Rotary gear wheel -->
  <g transform="translate(240,250)">
    <!-- Outer gear teeth (6 teeth) -->
    <g fill="#003366">
      <rect x="-18" y="-140" width="36" height="40" rx="6" />
      <rect x="-18" y="-140" width="36" height="40" rx="6" transform="rotate(60)" />
      <rect x="-18" y="-140" width="36" height="40" rx="6" transform="rotate(120)" />
      <rect x="-18" y="-140" width="36" height="40" rx="6" transform="rotate(180)" />
      <rect x="-18" y="-140" width="36" height="40" rx="6" transform="rotate(240)" />
      <rect x="-18" y="-140" width="36" height="40" rx="6" transform="rotate(300)" />
    </g>
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#003366" stroke-width="28" />
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#003366" stroke-width="16" />
    <!-- Center dot -->
    <circle cx="0" cy="0" r="20" fill="#F7A81B" />
  </g>
  <!-- Chat bubble (bottom-right) -->
  <g transform="translate(370, 380)">
    <path d="M0 -55 C-50 -55, -80 -25, -80 8 C-80 30, -65 48, -42 55 L-55 80 L-25 60 C-16 63, -8 64, 0 64 C50 64, 80 35, 80 8 C80 -25, 50 -55, 0 -55 Z"
          fill="#F7A81B" stroke="#003366" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="-28" cy="8" r="8" fill="#003366" />
    <circle cx="0" cy="8" r="8" fill="#003366" />
    <circle cx="28" cy="8" r="8" fill="#003366" />
  </g>
  <!-- Signal arcs -->
  <path class="arc1" d="M420 70 A55 55 0 0 1 455 130"
        fill="none" stroke="#F7A81B" stroke-width="12" stroke-linecap="round" />
  <path class="arc2" d="M440 30 A95 95 0 0 1 495 115"
        fill="none" stroke="#F7A81B" stroke-width="12" stroke-linecap="round" />
</svg>
