<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Original Rotary International Wheel -->
  <g transform="translate(256,256)">
    <!-- Gear teeth (24 teeth around the wheel) -->
    <g fill="#F7A81B">
      <rect x="-10" y="-210" width="20" height="30" rx="3" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(15)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(30)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(45)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(60)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(75)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(90)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(105)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(120)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(135)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(150)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(165)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(180)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(195)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(210)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(225)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(240)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(255)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(270)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(285)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(300)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(315)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(330)" />
      <rect x="-10" y="-210" width="20" height="30" rx="3" transform="rotate(345)" />
    </g>
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#F7A81B" stroke-width="28" />
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#F7A81B" stroke-width="20" />
    <!-- 6 Spokes -->
    <g stroke="#F7A81B" stroke-width="18" stroke-linecap="round">
      <line x1="0" y1="-110" x2="0" y2="-168" />
      <line x1="0" y1="-110" x2="0" y2="-168" transform="rotate(60)" />
      <line x1="0" y1="-110" x2="0" y2="-168" transform="rotate(120)" />
      <line x1="0" y1="-110" x2="0" y2="-168" transform="rotate(180)" />
      <line x1="0" y1="-110" x2="0" y2="-168" transform="rotate(240)" />
      <line x1="0" y1="-110" x2="0" y2="-168" transform="rotate(300)" />
    </g>
    <!-- Center hub -->
    <circle cx="0" cy="0" r="40" fill="#F7A81B" />
    <!-- Keyway (the notch in the center) -->
    <rect x="-8" y="-55" width="16" height="30" rx="3" fill="#F7A81B" />
  </g>
</svg>
