<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Rotary wheel (small, left-aligned) -->
  <g transform="translate(55,65)">
    <!-- Gear teeth (24) -->
    <g fill="#F7A81B">
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(15)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(30)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(45)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(60)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(75)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(90)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(105)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(120)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(135)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(150)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(165)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(180)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(195)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(210)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(225)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(240)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(255)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(270)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(285)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(300)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(315)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(330)" />
      <rect x="-4" y="-48" width="8" height="10" rx="1.5" transform="rotate(345)" />
    </g>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#F7A81B" stroke-width="7" />
    <circle cx="0" cy="0" r="27" fill="none" stroke="#F7A81B" stroke-width="5" />
    <g stroke="#F7A81B" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-24" x2="0" y2="-37" />
      <line x1="0" y1="-24" x2="0" y2="-37" transform="rotate(60)" />
      <line x1="0" y1="-24" x2="0" y2="-37" transform="rotate(120)" />
      <line x1="0" y1="-24" x2="0" y2="-37" transform="rotate(180)" />
      <line x1="0" y1="-24" x2="0" y2="-37" transform="rotate(240)" />
      <line x1="0" y1="-24" x2="0" y2="-37" transform="rotate(300)" />
    </g>
    <circle cx="0" cy="0" r="9" fill="#F7A81B" />
    <rect x="-2.5" y="-13" width="5" height="8" rx="1" fill="#F7A81B" />
  </g>
  <!-- "Connect" text next to wheel -->
  <text x="120" y="78" font-family="Jost, 'DM Sans', sans-serif" font-weight="300"
        font-size="48" fill="#F7A81B" letter-spacing="3">Connect</text>
