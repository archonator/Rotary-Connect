<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Währungsrechner</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 480px;
  }
  h1 {
    margin: 0 0 8px;
    color: #333;
    font-size: 26px;
  }
  .subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  input, select {
    padding: 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
    background: #fff;
  }
  input:focus, select:focus { border-color: #667eea; }
  input { flex: 2; }
  select { flex: 1; cursor: pointer; }
  .swap-btn {
    background: #667eea;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 18px;
    margin: 0 auto 16px;
    display: block;
    transition: transform 0.3s;
  }
  .swap-btn:hover { transform: rotate(180deg); }
  .result {
    background: linear-gradient(135deg, #f5f7ff, #eef1ff);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    margin-top: 20px;
  }
  .result-amount {
    font-size: 32px;
    font-weight: 700;
    color: #333;
    margin: 8px 0;
  }
  .result-rate {
    font-size: 13px;
    color: #777;
  }
  .note {
    font-size: 11px;
    color: #999;
    text-align: center;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>💱 Währungsrechner</h1>
  <div class="subtitle">Die 10 wichtigsten Währungen der Welt</div>

  <div class="row">
    <input type="number" id="amountFrom" value="100" step="0.01">
    <select id="from"></select>
  </div>

  <button class="swap-btn" onclick="swap()" title="Tauschen">⇅</button>

  <div class="row">
    <input type="number" id="amountTo" readonly>
    <select id="to"></select>
  </div>

  <div class="result">
    <div class="result-rate" id="rateText"></div>
    <div class="result-amount" id="resultBig"></div>
  </div>

  <div class="note">Hinweis: Kurse sind ungefähre Richtwerte (Stand April 2026). Für aktuelle Kurse bitte eine Bank oder Finanzseite konsultieren.</div>
</div>

<script>
// Wechselkurse relativ zu USD (ungefähre Richtwerte, Stand April 2026)
const rates = {
  USD: { name: "US-Dollar",        symbol: "$",   rate: 1.00    },
  EUR: { name: "Euro",             symbol: "€",   rate: 0.92    },
  GBP: { name: "Britisches Pfund", symbol: "£",   rate: 0.79    },
  JPY: { name: "Japanischer Yen",  symbol: "¥",   rate: 151.50  },
  CHF: { name: "Schweizer Franken",symbol: "CHF", rate: 0.88    },
  CNY: { name: "Chinesischer Yuan",symbol: "¥",   rate: 7.25    },
  CAD: { name: "Kanadischer Dollar",symbol:"C$",  rate: 1.37    },
  AUD: { name: "Australischer Dollar",symbol:"A$",rate: 1.52    },
  INR: { name: "Indische Rupie",   symbol: "₹",   rate: 83.50   },
  SEK: { name: "Schwedische Krone",symbol: "kr",  rate: 10.60   }
};

const fromSel = document.getElementById("from");
const toSel   = document.getElementById("to");
const amtFrom = document.getElementById("amountFrom");
const amtTo   = document.getElementById("amountTo");
const rateTxt = document.getElementById("rateText");
const resBig  = document.getElementById("resultBig");

Object.keys(rates).forEach(code => {
  const o1 = new Option(`${code} — ${rates[code].name}`, code);
  const o2 = new Option(`${code} — ${rates[code].name}`, code);
  fromSel.add(o1); toSel.add(o2);
});
fromSel.value = "EUR";
toSel.value   = "USD";

function convert() {
  const amt = parseFloat(amtFrom.value) || 0;
  const from = fromSel.value, to = toSel.value;
  const usd = amt / rates[from].rate;
  const result = usd * rates[to].rate;
  amtTo.value = result.toFixed(2);
  const single = (1 / rates[from].rate) * rates[to].rate;
  rateTxt.textContent = `1 ${from} = ${single.toFixed(4)} ${to}`;
  resBig.textContent = `${rates[to].symbol} ${result.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}

function swap() {
  const tmp = fromSel.value;
  fromSel.value = toSel.value;
  toSel.value = tmp;
  convert();
}

[amtFrom, fromSel, toSel].forEach(el => el.addEventListener("input", convert));
convert();
</script>
</body>
</html>
